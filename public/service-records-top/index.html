<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>サービス記録</title>
    <link rel="modulepreload" href="https://esm.sh/@supabase/supabase-js@2" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="header">
      <h1 class="title">サービス記録</h1>
      <p id="helperEmail" class="helper-email"></p>
    </header>

    <main class="main">
      <section class="card" id="cardMove">
        <h2 class="card-title">移動支援サービス記録</h2>
        <p id="moveCount" class="count">—</p>
        <p id="moveSub" class="sub">未記入の移動予定を記録します</p>
        <a id="btnMove" class="btn btn-primary" href="#">進む</a>
      </section>

      <section class="card" id="cardHome">
        <h2 class="card-title">居宅介護サービス記録</h2>
        <p id="homeCount" class="count">—</p>
        <p id="homeSub" class="sub">未記入の居宅予定を記録します</p>
        <a id="btnHome" class="btn btn-primary" href="#">進む</a>
      </section>
    </main>

    <footer class="footer">
      <a class="footer-link" href="/helpers/">ビレッジスケジュールを見る</a>
      <a class="footer-link" href="https://client-sche.web.app/">ひろばへ戻る</a>
    </footer>

    <script type="module" src="./main.js"></script>
  </body>
</html>
