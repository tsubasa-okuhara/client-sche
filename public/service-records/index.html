<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>移動支援サービス記録</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="back" href="../service-records-top/">← サービス記録トップへ</a>
      <h1>移動支援サービス記録</h1>
    </header>

    <main class="wrap">
      <!-- 未記入予定一覧 -->
      <section class="card listSection">
        <h2>未記入予定一覧</h2>
        <p class="hint">記録する予定を選んで「記録する」を押してください。</p>
        <div id="movesMessage" class="status movesMessage"></div>
        <div id="movesList" class="movesList"></div>
      </section>

      <!-- 記録入力フォーム（選択時のみ表示） -->
      <section id="formCard" class="card formCard" style="display: none">
        <h2>記録入力</h2>
        <p id="formSelectedLabel" class="hint">選択中の予定に対して記録を入力します。</p>

        <!-- 固定表示 -->
        <div class="formFixed">
          <div class="formFixedRow"><span class="formLabel">利用者名</span><span id="dispClientName" class="formValue">—</span></div>
          <div class="formFixedRow"><span class="formLabel">時間</span><span id="dispTime" class="formValue">—</span></div>
          <div class="formFixedRow"><span class="formLabel">ヘルパー名</span><span id="dispHelperName" class="formValue">—</span></div>
          <div class="formFixedRow"><span class="formLabel">配車</span><span id="dispRoute" class="formValue">—</span></div>
          <div class="formFixedRow"><span class="formLabel">内容</span><span id="dispNote" class="formValue">—</span></div>
          <div class="formFixedRow"><span class="formLabel">受給者番号</span><span id="dispBeneficiary" class="formValue">—</span></div>
        </div>

        <!-- 入力項目 -->
        <div class="formInputs">
          <div class="checkCard">
            <div class="checkTitle">状態</div>
            <div class="checkGrid">
              <label><input type="radio" name="condition" value="calm" /> 落ち着いていた</label>
              <label><input type="radio" name="condition" value="slightly-unstable" /> やや不安定</label>
              <label><input type="radio" name="condition" value="agitated" /> 興奮気味</label>
              <label><input type="radio" name="condition" value="seizure" /> 発作あり</label>
              <label><input type="radio" name="condition" value="condition-changed" /> 変化あり</label>
            </div>
          </div>

          <div class="checkCard">
            <div class="checkTitle">トイレ</div>
            <div class="checkGrid">
              <label><input type="radio" name="toilet" value="urination" /> 排尿</label>
              <label><input type="radio" name="toilet" value="defecation" /> 排便</label>
              <label><input type="radio" name="toilet" value="both" /> 両方</label>
              <label><input type="radio" name="toilet" value="no-toilet" /> なし</label>
              <label><input type="radio" name="toilet" value="diaper" /> おむつ</label>
              <label><input type="radio" name="toilet" value="assist" /> 介助</label>
            </div>
          </div>

          <div class="checkCard">
            <div class="checkTitle">天候</div>
            <div class="checkGrid">
              <label><input type="radio" name="weather" value="sunny" /> 晴れ</label>
              <label><input type="radio" name="weather" value="cloudy-sun" /> 晴れ時々曇り</label>
              <label><input type="radio" name="weather" value="cloudy" /> 曇り</label>
              <label><input type="radio" name="weather" value="rainy" /> 雨</label>
            </div>
          </div>

          <div class="checkCard">
            <div class="checkTitle">食事</div>
            <div class="checkGrid">
              <label><input type="radio" name="meal" value="all" /> 全量</label>
              <label><input type="radio" name="meal" value="half" /> 半量</label>
              <label><input type="radio" name="meal" value="none" /> なし</label>
            </div>
          </div>

          <div class="checkCard">
            <div class="checkTitle">水分</div>
            <div class="checkGrid">
              <label><input type="radio" name="water" value="enough" /> 十分</label>
              <label><input type="radio" name="water" value="lack" /> 不足</label>
            </div>
          </div>

          <div class="checkCard">
            <div class="checkTitle">服薬</div>
            <div class="checkGrid">
              <label><input type="radio" name="medication" value="taken" /> 服薬</label>
              <label><input type="radio" name="medication" value="forgot" /> 飲み忘れ</label>
              <label><input type="radio" name="medication" value="refused" /> 拒否</label>
            </div>
          </div>

          <div class="checkCard">
            <div class="checkTitle">交流</div>
            <div class="checkGrid">
              <label><input type="radio" name="interaction" value="yes" /> あり</label>
              <label><input type="radio" name="interaction" value="no" /> なし</label>
            </div>
          </div>

          <div class="formRow">
            <label class="formLabel" for="formMemo">メモ</label>
            <textarea id="formMemo" class="formMemo" rows="3" placeholder="自由記述（後で保存に利用します）"></textarea>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="./main.js?v=helper-20260315"></script>
  </body>
</html>
